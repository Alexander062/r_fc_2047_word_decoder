[project]
name = "r-fc-2047-word-decoder"
version = "0.1.1"
description = "Decodes RFC 2047 encoded-word headers in email messages, handling quoted-printable and base64 within charset-specified boundaries."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
